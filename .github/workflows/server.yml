name: server

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the Rust toolchain and Node pinned in mise.toml.
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('client/package-lock.json') }}
          restore-keys: npm-
      - name: Install client dependencies
        run: npm ci
        working-directory: client
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      # Same task as locally: server and client checks (see mise.toml).
      - name: Checks
        run: mise run ci
