[package]
name = "http-api"
description = "Inbound HTTP adapter: axum routes under /api/v1, DTOs, error format, OpenAPI contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "openapi"
path = "src/bin/openapi.rs"

[dependencies]
application.workspace = true
domain.workspace = true
ports.workspace = true
axum.workspace = true
chrono = { workspace = true, features = ["serde"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true

[dev-dependencies]
application = { workspace = true, features = ["testing"] }
events-memory.workspace = true
tokio.workspace = true
tempfile.workspace = true
http-body-util = "0.1"
tracing-subscriber.workspace = true

[lints]
workspace = true
