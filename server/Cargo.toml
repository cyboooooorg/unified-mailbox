[workspace]
resolver = "3"
# `crates/*` would also match the `crates/adapters` directory, which is
# not a crate: core crates are listed, adapters matched by glob.
members = [
  "crates/domain",
  "crates/ports",
  "crates/application",
  "crates/app",
  "crates/adapters/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
ports = { path = "crates/ports" }
application = { path = "crates/application" }
sqlite = { path = "crates/adapters/sqlite" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
thiserror = "2"
unicode-normalization = "0.1"
chacha20poly1305 = "0.10"
getrandom = { version = "0.3", features = ["std"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
