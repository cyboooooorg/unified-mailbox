[tools]
rust = { version = "1.99", components = "clippy,rustfmt" }

[tasks.ci]
description = "Run what the CI runs: format, lint and test the server"
dir = "{{config_root}}/server"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "cargo test --workspace --locked",
]
